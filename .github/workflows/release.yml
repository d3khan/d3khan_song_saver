name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Remove rust-toolchain.toml (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: rm -f rust-toolchain.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download bundled FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $root = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe" "$dir\d3khan-ffmpeg-x86_64-pc-windows-msvc.exe"

      - name: Download bundled FFmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          dir="src-tauri/binaries"
          mkdir -p "$dir"
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl -fsSL "$url" -o "$archive"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$archive" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          cp "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" "$dir/d3khan-ffmpeg-x86_64-unknown-linux-gnu"
          chmod +x "$dir/d3khan-ffmpeg-x86_64-unknown-linux-gnu"

      - name: Verify bundled binaries
        shell: bash
        run: |
          echo "=== Binaries directory ==="
          ls -la src-tauri/binaries/ || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall "yt-dlp[default] @ https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz"
          pip install --force-reinstall git+https://github.com/sigma67/ytmusicapi.git
          pip install pyinstaller requests spotifyscraper

      - name: Build downloader sidecar
        run: pyinstaller --onefile --name downloader downloader.py

      - name: Build spotify_meta sidecar
        run: pyinstaller --onefile --name spotify_meta spotify_meta_sidecar.py

      - name: Prepare sidecars (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp dist/downloader.exe    src-tauri/binaries/downloader-x86_64-pc-windows-msvc.exe
          cp dist/spotify_meta.exe  src-tauri/binaries/spotify_meta-x86_64-pc-windows-msvc.exe

      - name: Prepare sidecars (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          cp dist/downloader    src-tauri/binaries/downloader-x86_64-unknown-linux-gnu
          cp dist/spotify_meta  src-tauri/binaries/spotify_meta-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'd3khan song saver v__VERSION__'
          releaseBody: 'See the assets below to download the Windows or Linux installer.'
          releaseDraft: true
          prerelease: false