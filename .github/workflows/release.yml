name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Remove rust-toolchain.toml (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: rm rust-toolchain.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ------------------------------------------------------------------
      # FFmpeg / FFprobe: download static builds into src-tauri/binaries/
      # ------------------------------------------------------------------

      - name: Download bundled FFmpeg + FFprobe (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triple = "x86_64-pc-windows-msvc"
          $dir = "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # BtbN static GPL build (ffmpeg.exe + ffprobe.exe in bin/)
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force

          $root = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\bin\ffmpeg.exe"  "$dir\ffmpeg-$triple.exe"

      - name: Download bundled FFmpeg + FFprobe (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          triple="x86_64-unknown-linux-gnu"
          dir="src-tauri/binaries"
          mkdir -p "$dir"

          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl -fsSL "$url" -o "$archive"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$archive" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1

          cp "$RUNNER_TEMP/ffmpeg/bin/ffmpeg"  "$dir/ffmpeg-$triple"
          chmod +x "$dir/ffmpeg-$triple"

      - name: Verify bundled binaries
        shell: bash
        run: |
          ls -la src-tauri/binaries/
          # Windows uses .exe; Linux doesn't. Check whichever exists.
          if [ -f "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe" ]; then
            file src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          fi
          if [ -f "src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu" ]; then
            file src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          fi

      # ------------------------------------------------------------------
      # Python sidecar
      # ------------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall "yt-dlp[default] @ https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz"
          pip install pyinstaller requests

      - name: Build Python sidecar
        run: pyinstaller --onefile --name downloader downloader.py

      - name: Prepare sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp dist/downloader.exe src-tauri/binaries/downloader-x86_64-pc-windows-msvc.exe

      - name: Prepare sidecar (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          cp dist/downloader src-tauri/binaries/downloader-x86_64-unknown-linux-gnu

      # ------------------------------------------------------------------
      # Build & release
      # ------------------------------------------------------------------

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'd3khan song saver v__VERSION__'
          releaseBody: 'See the assets below to download the Windows or Linux installer.'
          releaseDraft: true
          prerelease: false