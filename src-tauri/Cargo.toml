[package]
name = "d3khans-song-saver"
version = "0.2.0"
description = "d3khan song saver - Spotify & YouTube Downloader"
authors = ["d3khan"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.12.28", features = ["json", "stream"] }
lofty = "0.21"
uuid = { version = "1.18.2", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
regex = "1.13.1"
url = "2.5.8"
futures-util = "0.3.34"
urlencoding = "2.1"
rusty_ytdl = "0.7.4"
bincode = "1.3" # ADDED FOR BINARY CACHE

[target.'cfg(not(target_os = "android"))'.dependencies]
zip = "2.2.0"
tar = "0.4.43"
flate2 = "1.0.35"
xz2 = "0.1.7"

[target.'cfg(target_os = "android")'.dependencies]
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }
shine-rs = "0.1.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
