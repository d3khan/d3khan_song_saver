[package]
name = "d3khan-song-saver"
version = "0.2.5"
description = "d3khan song saver"
authors = ["d3khan"]
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-shell = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util", "process", "rt"] }
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
bincode = "1.3"
regex = "1"
which = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
