[package]
name = "d3khans-song-saver"
version = "0.2.0"
description = "d3khan song saver - SoundCloud desktop app for tagged MP3s"
authors = ["d3khan"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Async runtime (Tauri already runs Tokio; these features cover process/fs/time)
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "time",
    "sync",
    "io-util",
] }

# SoundCloud API (search, track/playlist metadata)
soundcloud-rs = { version = "0.12.0", default-features = false }

# HTTP (audio + cover art download)
reqwest = { version = "0.12.28", features = ["json"] }

# Native audio pipeline: symphonia decodes HLS/AAC to PCM; shine-rs encodes MP3 (pure Rust, no FFI)
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }
shine-rs = "0.1.4"

# MP3/ID3 tagging
lofty = "0.21"

# Filesystem traversal for nested-folder scan
walkdir = "2.5.0"

# Misc
uuid = { version = "1.18.2", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
regex = "1.13.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
